name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          (cd packages/db && npx drizzle-kit generate --name ci_check)
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "Schema changed without a committed migration. Run: npm run db:generate"
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - run: npm run build --workspace=web

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Android JS bundle builds
        run: npm run bundle:check
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
