name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npm run db:generate -- --name ci_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "Schema changed without a committed migration. Run: npm run db:generate"
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - run: npm run build --workspace=web
